# The unit tests replace the heavy libraries (torch, coqui-tts, Ollama) with fakes, so this runs
# on Linux, Windows and macOS to check the portability of Herald's own code, not of torch/coqui.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not hide the results of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash # Git Bash on the Windows runners: the same syntax on all three systems
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # torch and coqui-tts (several GB) are not installed. Only what the tests import is: the
      # pins come from pyproject.toml.
      - name: Install herald without its heavy dependencies
        run: |
          pip install --no-deps -e .
          python - <<'EOF' > ci-requirements.txt
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          light = [d for d in project["dependencies"] if d.split("==")[0] in ("requests", "numpy")]
          print("\n".join(light + project["optional-dependencies"]["dev"]))
          EOF
          pip install -r ci-requirements.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        run: pytest -m "not integration"

      # Cheap check that both Compose files (and their merge) are valid; nothing is built.
      # Linux only: Docker is preinstalled there, not on the macOS runners.
      - name: Validate the Compose files
        if: runner.os == 'Linux'
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
